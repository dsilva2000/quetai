services:
  - type: web
    name: quetai
    runtime: node
    region: ohio          # Más cercano a Lima
    plan: free
    # Render does not compile TypeScript. It installs deps and runs the
    # committed bundle. Server changes are live only after `npm run build`
    # and committing dist/index.cjs.
    buildCommand: npm install --omit=dev && npm rebuild better-sqlite3
    startCommand: NODE_ENV=production node dist/index.cjs
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000        # Render usa el puerto 10000
      - key: TZ
        value: America/Lima
      - key: OPENAI_BASE_URL
        sync: false         # Se configura manualmente en el dashboard
      - key: OPENAI_API_KEY
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: FCM_SERVICE_ACCOUNT
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ADMIN_PIN
        value: "0069"
      - key: ALEXA_SKILL_ID
        sync: false
      - key: ALEXA_SKIP_VERIFICATION
        value: "false"
      - key: ASSISTANT_NAME
        value: Quetai
      - key: LLM_MODEL
        sync: false
      - key: LLM_MODEL_FALLBACK
        value: openai/gpt-oss-20b
      - key: ALEXA_LLM_TIMEOUT_MS
        value: "5500"
      - key: NEWS_ENABLED
        value: "true"
      # The app writes SQLite here. Render only mounts the disk below on a
      # paid instance (Starter or above). Free ignores disks and wipes the
      # filesystem on every deploy and after 15 minutes idle. See docs/ALEXA.md.
      - key: DATA_DIR
        value: /app/data
      # Durable memory. Both must be set or the server stays on SQLite.
      # SUPABASE_SERVICE_KEY is the sb_secret_... key. Do not commit it.
      - key: SUPABASE_URL
        value: https://enypjatzskpnupiqfaoa.supabase.co
      - key: SUPABASE_SERVICE_KEY
        sync: false
    disk:
      name: quetai-data
      mountPath: /app/data
      sizeGB: 1
    healthCheckPath: /api/health
    autoDeploy: true
    branch: master
    repo: https://github.com/dsilva2000/quetai
